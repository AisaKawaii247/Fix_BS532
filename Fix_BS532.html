/* ==========================================
   4. Mosaic Effect (Range 0.5 - 10) - ฉบับคืนร่างเดิม (ไม่ทับตัวหนังสือ)
   ========================================== */
[class*="mosaic-"] {
    position: relative;
    overflow: hidden;
    z-index: 1;
}

[class*="mosaic-"]::before {
    content: "";
    position: absolute;
    inset: 0;
    z-index: -1;
    pointer-events: none;
    background-image: 
        linear-gradient(to right, rgba(0, 0, 0, 0.15) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(0, 0, 0, 0.15) 1px, transparent 1px);
}

.mosaic-0\.5::before { backdrop-filter: blur(0.5px); background-size: 4px 4px; }
